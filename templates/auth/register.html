<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — Hostick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card register-card">
        <div class="auth-header">
            <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill me-2"></i>Student Registration</h4>
            <p class="mb-0 small text-white-50">Create your Hostick account to request digital outing passes</p>
        </div>

        <div class="p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Karthik Selvam" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Register Number *</label>
                        <input type="text" name="register_number" class="form-control" placeholder="e.g. 23CS112" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">College Email *</label>
                        <input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Department *</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <optgroup label="M.Sc Integrated Programs">
                                <option value="M.Sc Integrated Data Science">M.Sc Integrated Data Science</option>
                                <option value="M.Sc Integrated Software Systems">M.Sc Integrated Software Systems</option>
                                <option value="M.Sc Integrated Artificial Intelligence and Machine Learning">M.Sc Integrated Artificial Intelligence and Machine Learning</option>
                                <option value="M.Sc Integrated Decision and Computing Sciences">M.Sc Integrated Decision and Computing Sciences</option>
                            </optgroup>
                            <optgroup label="Engineering &amp; Technology">
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics & Communication">Electronics &amp; Communication</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="AI & Data Science">AI &amp; Data Science</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold">Year *</label>
                        <select name="year_of_study" class="form-select" required>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Hostel *</label>
                        <select name="hostel_id" id="hostelSelect" class="form-select" required>
                            <option value="">Select Hostel</option>
                            {% for h in hostels %}
                                <option value="{{ h.id }}">{{ h.name }} ({{ h.block_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Room Number *</label>
                        <select name="room_id" id="roomSelect" class="form-select" required>
                            <option value="">Select Hostel First</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Student Phone *</label>
                        <input type="tel" name="phone" class="form-control" placeholder="10-digit mobile number" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Parent / Guardian Phone</label>
                        <input type="tel" name="parent_phone" class="form-control" placeholder="Optional contact number">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Password *</label>
                        <input type="password" name="password" class="form-control" minlength="6" placeholder="Min. 6 characters" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Confirm Password *</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="6" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                    <button type="submit" class="btn btn-navy px-4 fw-semibold">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
